name: Image smoke build

# Builds the processor image without pushing it, so Dockerfile rot (bad base
# tag, broken COPY, builder-env drift) fails CI instead of surfacing only at
# on-prem deploy time (#558). Secret-free by design: no login, no push, local
# tag only. Image publishing (quay.io) lives in #568 and is unaffected.
on:
  pull_request:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image-smoke.yml'
      - 'go.mod'
      - 'go.sum'
      - 'rosocp.go'
      - 'openapi.json'
      - 'resource_optimization_openshift.json'
      - 'cmd/**'
      - 'internal/**'
      - 'librobne/**'
      - 'migrations/**'
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image-smoke.yml'
      - 'go.mod'
      - 'go.sum'
      - 'rosocp.go'
      - 'openapi.json'
      - 'resource_optimization_openshift.json'
      - 'cmd/**'
      - 'internal/**'
      - 'librobne/**'
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build processor image (no push)
        run: docker build -t rosocp:ci-smoke .
      - name: Assert GLIBC ceiling (ubi10 runtime)
        run: |
          # The runtime base is ubi10 (glibc 2.39): fail if the binary needs
          # anything newer, so a future builder-side bump re-opens loudly
          # instead of dying at pod startup (#562). sort -V orders versions
          # correctly, so appending the ceiling and checking it sorts last is
          # an exact "nothing above" assertion.
          cid=$(docker create rosocp:ci-smoke)
          docker cp "$cid:/rosocp" /tmp/rosocp-ci-smoke
          docker rm "$cid" >/dev/null
          highest=$( (objdump -T /tmp/rosocp-ci-smoke | grep -o 'GLIBC_[0-9.]*'; echo GLIBC_2.39) | sort -uV | tail -n 1)
          echo "highest required GLIBC is $highest (ceiling GLIBC_2.39)"
          if [ "$highest" != "GLIBC_2.39" ]; then
            echo "ERROR: binary requires $highest, above the ubi10 runtime ceiling GLIBC_2.39 (see #562)"
            exit 1
          fi
