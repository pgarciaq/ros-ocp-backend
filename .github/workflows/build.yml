name: CI/CD Sanity Checks

on:
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
  pull_request:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          # A workflow can never catch its own syntax error at run time —
          # GitHub refuses to run an invalid workflow — so every workflow
          # file is linted here, at push/PR time, the moment it lands
          # (#877). actionlint also runs shellcheck on `run:` blocks
          # (ubuntu runners ship it). The version is pinned so findings
          # cannot drift with @latest.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Guard processor image CGO flags
        run: |
          # Assumption: the rosocp binary requires confluent-kafka-go
          # (librdkafka), so the processor image must build with
          # CGO_ENABLED=1. Revisit if the processor is ever retired per the
          # robne-cutover epics — the negative check below would then be a
          # false failure (see #524).
          # NOTE: comment lines are excluded — Dockerfile documents the
          # CGO_ENABLED=0 exception for the robne CLI in a comment.
          if grep -v '^[[:space:]]*#' Dockerfile | grep -q 'CGO_ENABLED=0'; then
            echo "ERROR: Dockerfile must not set CGO_ENABLED=0 (processor needs confluent-kafka-go, see #524)"
            exit 1
          fi
          if ! grep -v '^[[:space:]]*#' Dockerfile | grep -Eq 'CGO_ENABLED=1[[:space:]]+go build'; then
            echo "ERROR: Dockerfile go build line must contain CGO_ENABLED=1 (see #524)"
            exit 1
          fi
      - name: Negative compile (CGO=0 must fail for rosocp)
        run: |
          # confluent-kafka-go cannot compile with CGO disabled: a successful
          # CGO=0 build means the Kafka dependency was lost, not that the
          # processor became portable (see #524). Assert failure, not message
          # text — the compiler reports undefined kafka.* symbols.
          # #909: the compiler's stderr goes to a file, not the log — setup-go's
          # Go problem matcher turns "file:line: undefined: ..." lines into
          # ERROR annotations, rendering this passing guard's expected output
          # as red X's on green runs. The summary line below carries no
          # file:line patterns, so the matcher leaves it alone. A count of 0
          # with a failed build means the failure is NOT the expected kafka
          # one — the CGO=1 "Check Build" step will show the real error.
          neg_err="$(mktemp)"
          if CGO_ENABLED=0 go build -o /dev/null . 2>"$neg_err"; then
            echo "ERROR: CGO_ENABLED=0 build of rosocp unexpectedly succeeded (see #524)"
            exit 1
          fi
          echo "OK: CGO_ENABLED=0 build fails as expected ($(grep -c 'undefined: kafka' "$neg_err" || true) expected undefined kafka.* compiler errors suppressed from annotations: #909)"
      - name: Guard middleware order (limiter before Rbac)
        run: |
          # Throttled identities must 429 before paying a full RBAC round-trip,
          # which depends on registration order in server.go, not just on both
          # middlewares existing (see #547). Assert line order, not presence.
          limiter_line=$(grep -n 'v1.Use(ros_middleware.NewRateLimiter(cfg))' internal/api/server.go | head -1 | cut -d: -f1)
          rbac_line=$(grep -n 'v1.Use(ros_middleware.Rbac)' internal/api/server.go | head -1 | cut -d: -f1)
          if [ -z "$limiter_line" ] || [ -z "$rbac_line" ]; then
            echo "ERROR: expected both NewRateLimiter and Rbac registrations in internal/api/server.go (see #547)"
            exit 1
          fi
          if [ "$limiter_line" -gt "$rbac_line" ]; then
            echo "ERROR: NewRateLimiter (line $limiter_line) must register before Rbac (line $rbac_line) (see #547)"
            exit 1
          fi
          echo "OK: rate limiter precedes Rbac (lines $limiter_line < $rbac_line)"
      - name: Run golangci-lint
        run: make lint
      - name: Run unit tests
        run: make test
      - name: Race-detector regressions (kafka concurrency core, #804)
        run: go test -race ./internal/kafka/ -count=1
      - name: Check Build
        run: make build
      - name: Check robne build (blessed CGO=0 path)
        run: make robne
