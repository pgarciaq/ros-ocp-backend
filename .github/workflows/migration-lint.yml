name: Migration lint

# Guard for non-CONCURRENTLY indexes on large tables (#560). Runs only on
# changed migration files so pre-existing violations never fail the build.
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'scripts/lint-migrations.sh'
      - '.github/workflows/migration-lint.yml'
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'migrations/**'
      - 'scripts/lint-migrations.sh'
      - '.github/workflows/migration-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint changed migrations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            # Push events have no base_ref; diffing origin/main...HEAD on a
            # long-lived fork branch lints every migration ever added,
            # defeating the "changed files only" intent. Diff the commits
            # actually pushed instead. A new branch's first push carries an
            # all-zeros before-SHA — fall back to the previous commit.
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
              before="${{ github.event.sha }}~1"
            fi
            range="$before..${{ github.event.sha }}"
          fi
          mapfile -t files < <(git diff --name-only "$range" -- 'migrations/*.up.sql' | grep '\.up\.sql$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "migration lint: no changed migration files"
            exit 0
          fi
          ./scripts/lint-migrations.sh "${files[@]}"
