name: Documentation

on:
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'internal/plugin/**'
      - 'internal/plugins/**'
      - 'docs/**'
      - 'docs-site/**'
      - 'librobne/**'
      - 'openapi.json'
      - 'mkdocs.yml'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
      - 'scripts/generate-docs.sh'
      - 'scripts/generate-librobne-docs.sh'
      - 'scripts/check-docs-drift.sh'
      - '.github/workflows/docs-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install mkdocs-material
        run: pip install mkdocs-material mkdocs-section-index mkdocs-git-revision-date-localized-plugin mkdocs-macros-plugin

      - name: Assemble known-issues and contributing copies
        run: ./scripts/generate-docs.sh

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Check docs drift footguns
        run: ./scripts/check-docs-drift.sh

      - name: Build documentation site
        run: mkdocs build --config-file mkdocs.yml --site-dir _site

      - name: Generate librobne API HTML (doc2go)
        run: ./scripts/generate-librobne-docs.sh _site/pkg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
