name: Release robne CLI binaries

# Tag-driven robne CLI releases (#877, #906): push a tag
# robne-0.<phase>.YYYYMMDD-HHMM-<sha7> (make robne-release computes and pushes
# it; the OpenChamber nightly task drives the same target) and this workflow
# builds the CGO-free binaries for linux/amd64, linux/arm64, darwin/arm64 and
# windows/amd64, then publishes them — with the two sample config files and
# SHA256SUMS — as a GitHub Release.
#
# Structure (#906): a guard job (tag contract + vendored-engine gate), a build
# matrix where EVERY leg smoke-tests its binary natively (linux/arm64 executes
# under QEMU binfmt; darwin and windows build on their own runners — macOS
# binaries cannot run on Linux at all, and Git Bash on windows-latest runs the
# same bash smoke steps), and a release job that gathers the artifacts and
# creates the release once.
#
# Tag events carry no branch name: the phase component is parsed from the tag,
# and the stamp + sha7 are re-asserted against the commit. Accepted residual:
# a hand-crafted tag could lie about the phase (cosmetic — the sha still joins
# the release to its commit); every real release comes from make robne-release,
# which reads the branch.
#
# One commit = one immutable release: a re-run fails loudly at gh release
# create (the tag already exists). Re-releasing means explicitly deleting the
# tag and the release first — by design, not a bug.
#
# workflow_dispatch is declared for the post-fork-transition default branch
# only: today the fork's frozen main cannot dispatch anything (the same
# constraint publish-quay.yml lives with) — the tag trigger is the working
# path.
on:
  push:
    tags: ['robne-*']
  workflow_dispatch:

permissions:
  # The only workflow in this repo with contents: write — required to create
  # the release. Everything it needs beyond that is the default read.
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Guard tag shape; assert stamp and sha against the commit
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^robne-0\.[0-9]+\.[0-9]{8}-[0-9]{4}-[0-9a-f]{7}$ ]]; then
            echo "release-robne: tag '${tag}' does not match robne-0.<phase>.YYYYMMDD-HHMM-<sha7>" >&2
            exit 1
          fi
          version="${tag#robne-}"
          expected_stamp="$(TZ=UTC git log -1 --format=%cd --date=format:%Y%m%d-%H%M)"
          expected_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          if [[ "$version" != *".${expected_stamp}-${expected_sha}" ]]; then
            echo "release-robne: tag '${tag}' stamp/sha do not match its commit (expected *.${expected_stamp}-${expected_sha})" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release-robne: releasing robne ${version}"
      - name: Vendored librobne must match ./librobne (#510)
        # A clean-checkout make robne compiles the vendored librobne (Go's
        # default with a vendor dir), while the product image compiles
        # ./librobne — never release a binary built from a drifted engine.
        run: make vendor-librobne-check

  build:
    needs: guard
    strategy:
      # Let every leg report its own failure; the release job needs them all.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, archive: tar.gz }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, archive: tar.gz }
          # macos-15, not macos-latest: same arm64 architecture, separate
          # (older, less contended) runner pool. On 2026-11-19 the
          # macos-latest pool failed to acquire a runner twice — 15 minutes
          # of queueing, then cancellation, zero steps executed. Revisit when
          # capacity normalizes.
          - { os: macos-15, goos: darwin, goarch: arm64, archive: tar.gz }
          - { os: windows-latest, goos: windows, goarch: amd64, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # windows-latest defaults to pwsh; every bash step below (including
        # the smoke) runs under the preinstalled Git Bash instead.
        shell: bash
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up QEMU binfmt
        # Building cross-arch needs no emulation (pure Go), but EXECUTING the
        # linux/arm64 binary for its smoke test on this amd64 runner does.
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - name: Build
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            # No make on this leg: the mingw make shipped on windows runners
            # resolves a broken shell for its recipes (actions/runner-images
            # #7253). This is the Makefile's robne recipe verbatim — keep the
            # two in sync.
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
              -ldflags="-s -w -X main.version=${version}" -o robne.exe ./cmd/robne
          else
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make robne ROBNE_VERSION="${version}"
          fi
      - name: Smoke-test the binary
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            bin=./robne.exe
          else
            bin=./bin/robne
          fi
          # Smoke: the binary must self-identify as this release and compute.
          # Take the first line in bash instead of piping into `head -1`: under
          # `set -o pipefail` the producer dies of SIGPIPE as soon as head exits
          # (robne writes `version` in 16 separate writes), and the pipeline then
          # reports 141. The first #877 release attempt failed exactly there on
          # the arm64 leg.
          version_out="$(HOME="$(mktemp -d)" "${bin}" version)"
          ident="${version_out%%$'\n'*}"
          if [[ "$ident" != "robne ${version}" ]]; then
            echo "release-robne: ${bin} identifies as '${ident}', expected 'robne ${version}'" >&2
            exit 1
          fi
          smoke_json="$(mktemp)"
          HOME="$(mktemp -d)" "${bin}" recommend \
            --input cmd/robne/testdata/hcp-capacity \
            --plugins hcp --format json --no-user-config \
            --now 2026-10-26T22:30:00Z > "${smoke_json}"
          # The gate must PARSE the payload, not grep it (#904): a grep is
          # satisfied by a log-polluted file no JSON consumer can read —
          # exactly how this defect shipped green once. The file is piped to
          # python's stdin because a native Windows python cannot open Git
          # Bash's /tmp paths (the first run failed exactly there).
          if ! cat "${smoke_json}" | python3 -c "import json, sys; d = json.load(sys.stdin); sys.exit(0 if 'hcp_recommendations' in d else 1)"; then
            echo "release-robne: ${bin} smoke output is not one parseable JSON document with hcp_recommendations:" >&2
            cat "${smoke_json}" >&2
            exit 1
          fi
          echo "release-robne: ${bin} smoked OK"
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          stage="$(mktemp -d)"
          cp bin/robne "${stage}/robne"
          cp cmd/robne/robne.yaml.sample cmd/robne/rate-card.json.sample "${stage}/"
          # #908: identity and docs ride with the binary — README (from the
          # dist source), the license, and the manpages in both formats.
          cp cmd/robne/dist-README.md "${stage}/README.md"
          cp LICENSE "${stage}/"
          cp -r docs/man/man1 "${stage}/man1"
          cp -r docs/man/markdown "${stage}/man-markdown"
          tar -czf "robne-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            -C "${stage}" robne robne.yaml.sample rate-card.json.sample README.md LICENSE man1 man-markdown
      - name: Package (zip)
        # Windows archives are zip per #906. Git Bash's tar is GNU tar and
        # cannot write zip; Compress-Archive is the native path.
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.guard.outputs.version }}"
          # #908: same enrichment as the tarballs, Windows-named.
          Copy-Item cmd/robne/dist-README.md README.md
          Copy-Item -Recurse docs/man/man1 man1
          Copy-Item -Recurse docs/man/markdown man-markdown
          Compress-Archive -Path robne.exe,cmd/robne/robne.yaml.sample,cmd/robne/rate-card.json.sample,README.md,LICENSE,man1,man-markdown -DestinationPath "robne-$version-windows-amd64.zip"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: robne-${{ needs.guard.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: robne-${{ needs.guard.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          # #910: the notes' "This release carries" section needs the
          # previous robne-* tag — full history makes git tag -l see it.
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/robne-*)
          if [[ "${#archives[@]}" -ne 4 ]]; then
            echo "release-robne: expected 4 archives, found ${#archives[@]}:" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi
          ( cd dist && sha256sum robne-* > ../SHA256SUMS )
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          subject="$(git log -1 --format=%s)"
          phase="${version#0.}"; phase="${phase%%.*}"
          # #910: "This release carries" — the commits between the previous
          # robne-* tag and this one (sort -V for phase-number safety; the
          # range is commits reachable from HEAD but not the previous tag,
          # correct under any branch topology including a phase rollover).
          # First release ever: no previous tag, today's notes shape.
          # Plain string concatenation, not printf format strings: command
          # substitution strips trailing newlines, which glued the subject
          # onto the last bullet in the first draft (caught by local
          # verification against the real tags).
          prev_tag="$(git tag -l 'robne-*' | sort -V | grep -v "^robne-${version}$" | tail -1)"
          notes="Built from commit ${GITHUB_SHA} on the phase ${phase} branch."
          notes+=$'\n\n'
          if [ -n "$prev_tag" ]; then
            notes+=$'This release carries:\n\n'
            notes+="$(git log --format='- %s' "${prev_tag}..HEAD")"
            notes+=$'\n\n'
          fi
          notes+="${subject}"
          # The tag was pushed by make robne-release before this run started;
          # gh release create attaches the release to the existing tag.
          gh release create "robne-${version}" \
            --title "robne ${version}" \
            --notes "$notes" \
            "dist/robne-${version}-linux-amd64.tar.gz" \
            "dist/robne-${version}-linux-arm64.tar.gz" \
            "dist/robne-${version}-darwin-arm64.tar.gz" \
            "dist/robne-${version}-windows-amd64.zip" \
            SHA256SUMS
