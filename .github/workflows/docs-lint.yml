name: Docs lint

# Light docs-site link linter (#419). Non-blocking until escape backlog is cleared.
# Soft mode exits 0; continue-on-error keeps the check visible without gating merges.
on:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'scripts/check-docs-lint.sh'
      - '.github/workflows/docs-lint.yml'
      - 'Makefile'
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'docs-site/**'
      - 'scripts/check-docs-lint.sh'
      - '.github/workflows/docs-lint.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Docs lint (soft)
        env:
          DOCS_LINT_SOFT: "1"
        run: ./scripts/check-docs-lint.sh
