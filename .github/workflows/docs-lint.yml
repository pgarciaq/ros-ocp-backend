name: Docs lint

# Two gates:
#   check-docs-lint.sh       docs-site relative links + Class A stamps (#419)
#   check-internal-links.sh  docs/** and root guides: relative links and
#                            GitHub heading anchors (#778)
on:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'scripts/check-docs-lint.sh'
      - 'scripts/check-internal-links.sh'
      - 'scripts/generate-docs.sh'
      - 'scripts/check-generated-docs.sh'
      - '.github/workflows/docs-lint.yml'
      - 'Makefile'
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'scripts/check-docs-lint.sh'
      - 'scripts/check-internal-links.sh'
      - 'scripts/generate-docs.sh'
      - 'scripts/check-generated-docs.sh'
      - '.github/workflows/docs-lint.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Docs lint (strict)
        run: ./scripts/check-docs-lint.sh

      - name: Internal docs links (strict)
        run: ./scripts/check-internal-links.sh
