name: Docs lint

# docs-site relative-link linter (#419). Hard-fail once escape backlog cleared.
on:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/known-issues.md'
      - 'CONTRIBUTING.md'
      - 'scripts/check-docs-lint.sh'
      - 'scripts/generate-docs.sh'
      - '.github/workflows/docs-lint.yml'
      - 'Makefile'
  push:
    branches: [main, 'pgarciaq-rosocp-superpowers-*']
    paths:
      - 'docs-site/**'
      - 'docs/known-issues.md'
      - 'CONTRIBUTING.md'
      - 'scripts/check-docs-lint.sh'
      - 'scripts/generate-docs.sh'
      - '.github/workflows/docs-lint.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Docs lint (strict)
        run: ./scripts/check-docs-lint.sh
