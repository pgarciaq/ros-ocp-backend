# GPU Model Catalog
#
# This file defines the hardware specifications for all recognized NVIDIA GPU
# models. It is embedded at compile time via go:embed and parsed on startup.
#
# To add a new GPU:
#   1. Add an entry below with correct specs from NVIDIA's datasheet
#   2. Add a matching case in matchGPUModelKey() in gpu_metadata.go
#   3. Add a test case in gpu_metadata_test.go
#
# Sources: NVIDIA product datasheets, CUDA toolkit documentation
# Last updated: 2026-05-20

